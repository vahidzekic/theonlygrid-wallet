<!doctype html>
<html lang="sr-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stranica nije pronađena · TOG Wallet</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<style>
  :root { --bg: #0d0f13; --text: #eef0f3; --muted: #a3a8b3; --accent: #5aa2ff; --border: #262a33; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", Arial, sans-serif; line-height: 1.6; padding: 24px 16px; }
  main { max-width: 520px; text-align: center; }
  svg { width: 64px; height: 64px; }
  h1 { font-size: 1.8rem; margin: 16px 0 8px; }
  p { color: var(--muted); margin: 0 0 12px; }
  a { color: var(--accent); }
  .links { display: flex; gap: 12px 20px; justify-content: center; flex-wrap: wrap; margin-top: 20px; }
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#0d0f13"/><g fill="none" stroke="#a3a8b3" stroke-width="1.4" opacity=".45"><circle cx="16" cy="16" r="11"/><path d="M16 5v22M5 16h22"/></g><circle cx="16" cy="16" r="4" fill="#3987e5"/><circle cx="16" cy="5" r="2.2" fill="#2cc3b0"/><circle cx="27" cy="16" r="2.2" fill="#2cc3b0"/><circle cx="16" cy="27" r="2.2" fill="#2cc3b0"/><circle cx="5" cy="16" r="2.2" fill="#2cc3b0"/></svg>
  <h1>Stranica nije pronađena</h1>
  <p>Adresa ne postoji ili je stranica premeštena.</p>
  <p lang="en">Page not found. The address does not exist or the page has moved.</p>
  <p lang="de">Seite nicht gefunden. Die Adresse existiert nicht oder die Seite wurde verschoben.</p>
  <div class="links">
    <!-- The site may live at /theonlygrid-wallet/ (GitHub Pages) or at the root of a custom domain.
         The inline script points these links at the right base; without JavaScript they use the GitHub Pages path. -->
    <a class="home" data-path="" href="/theonlygrid-wallet/">Početna</a>
    <a class="home" data-path="uputstvo.html" href="/theonlygrid-wallet/uputstvo.html">Uputstvo</a>
    <a class="home" data-path="en/" href="/theonlygrid-wallet/en/" lang="en">English</a>
    <a class="home" data-path="de/" href="/theonlygrid-wallet/de/" lang="de">Deutsch</a>
  </div>
</main>
<script>
  (function () {
    var base = location.pathname.indexOf('/theonlygrid-wallet/') === 0 ? '/theonlygrid-wallet/' : '/';
    var links = document.querySelectorAll('a.home');
    for (var i = 0; i < links.length; i++) links[i].setAttribute('href', base + links[i].getAttribute('data-path'));
  })();
</script>
</body>
</html>
